# Global mise config — stowed to ~/.config/mise/config.toml
# Docs: https://mise.jdx.dev/configuration.html
#
# Versions are pinned to major.minor on purpose: predictable upgrades, but no
# sudden major bumps. Run `mise upgrade` (then `mise lock`) to move them.
# `mise use -g tool@x.y` edits this file in place — commit the change.

[tools]
# --- languages / runtimes ---
bun = "1.4"
deno = "2.9"
go = "1.27"

# --- CLIs (were pkgx symlinks in ~/.local/bin) ---
uv       = "0.13"
pnpm     = "12.20"
gh       = "2.104"
firebase = "15.36"
flyctl   = "0.5"
turso    = "1.0"

# --- CLIs (were ad-hoc `pkgx <cmd>`, never linked) ---
bat         = "0.26"
tokei       = "15.0"
glow        = "3.0"
act         = "0.2"
ast-grep    = "0.51"
bottom      = "0.15"
lazygit     = "0.66"
lazydocker  = "0.25"
cloc        = "1.96"
fastfetch   = "2.71"
cloudflared = "2026.11"
eza         = "0.23"
